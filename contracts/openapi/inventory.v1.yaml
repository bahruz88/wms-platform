    post:
      operationId: confirmIssueReceipt
      summary: Hədəf lokasiya qəbulu təsdiqləyir (IN_TRANSIT → hədəf)
      description: |
        `DISPATCHED → RECEIVED` (miqdarlar üst-üstə düşür) və ya `DISPATCHED → DISCREPANCY` (ən azı bir sətirdə
        `receivedQty ≠ dispatchedQty`). Hər halda ikinci qrup yazılır: `IN_TRANSIT` −receivedQty, hədəf +receivedQty.
        Fərq olan sətirdə `reasonCodeId` + `note` **məcburidir** (`422 REASON_CODE_REQUIRED`); çatışmayan hissə
        `IN_TRANSIT`-də qalır və anbardar tərəfindən ayrıca sənədlə (tullantı / storno / düzəliş) bağlanır.
        `receivedQty > dispatchedQty` qadağandır (`422`).

        Yalnız hədəf lokasiyanın istifadəçisi (və ya `inv.issue.confirm_any`) çağıra bilər. `TransferCompleted`
        event-i outbox-a düşür.

        `409` kodları: `LOCATION_FROZEN` (hədəf), `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Issues]
      x-permission: inv.issue.confirm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
