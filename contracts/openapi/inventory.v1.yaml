    post:
      operationId: dispatchIssue
      summary: Göndər (mənbə → IN_TRANSIT)
      description: |
        `DRAFT → DISPATCHED`. `ISSUE`/`TRANSFER` qrupu: mənbə lokasiya −qty, `IN_TRANSIT` +qty (SPEC §12.3).
        Partiya ayırması `FOR UPDATE SKIP LOCKED` ilə (SPEC §12.4). Məxaricdə `unitCost` = cari `avgUnitCost`.
        `require_branch_receipt_confirmation=false` olduqda server dərhal qəbulu da yazır (`RECEIVED`).

        `409` kodları:
        * `INSUFFICIENT_STOCK` — `qtyAvailable` çatmır (mənfi balans qadağandır);
        * `BATCH_BLOCKED` — seçilmiş partiya `BLOCKED/EXPIRED/QUARANTINE`;
        * `LOCATION_FROZEN` — mənbə və ya hədəf lokasiyada FROZEN sayım;
        * `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
