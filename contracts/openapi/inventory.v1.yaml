      $ref: './common.v1.yaml#/components/responses/Conflict'
    UnprocessableEntity:
      $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'

  schemas:
    # --- aliases into common ---
    Id:
      $ref: './common.v1.yaml#/components/schemas/Id'
    Decimal:
      $ref: './common.v1.yaml#/components/schemas/Decimal'
    Percent:
      $ref: './common.v1.yaml#/components/schemas/Percent'
    CurrencyCode:
      $ref: './common.v1.yaml#/components/schemas/CurrencyCode'
    Money:
      $ref: './common.v1.yaml#/components/schemas/Money'
    Quantity:
      $ref: './common.v1.yaml#/components/schemas/Quantity'
    DateOnly:
      $ref: './common.v1.yaml#/components/schemas/DateOnly'
    DateTimeUtc:
      $ref: './common.v1.yaml#/components/schemas/DateTimeUtc'
    RowVersion:
      $ref: './common.v1.yaml#/components/schemas/RowVersion'
    AuditFields:
      $ref: './common.v1.yaml#/components/schemas/AuditFields'
    PageMeta:
      $ref: './common.v1.yaml#/components/schemas/PageMeta'
    ProblemDetails:
      $ref: './common.v1.yaml#/components/schemas/ProblemDetails'
    VersionedAction:
      $ref: './common.v1.yaml#/components/schemas/VersionedAction'

    # --- shared action bodies ---
    ReasonedVersionedAction:
      type: object
      required: [rowVersion, reasonCodeId]
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        reasonCodeId:
          $ref: '#/components/schemas/Id'
        note:
          type: [string, 'null']
          maxLength: 1000

    ApprovalDecisionBody:
      type: object
      required: [rowVersion, decision]
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        comment:
          type: [string, 'null']
          maxLength: 1000
          description: '`REJECTED` olduqda məcburidir (`422`).'

    # --- enums ---
    ReceiptStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]
    QualityStatus:
      type: string
      enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]
    BatchStatus:
      type: string
      enum: [ACTIVE, BLOCKED, EXPIRED, QUARANTINE]
      description: '`ACTIVE` olmayan partiya məxaricə ayrılmır (SPEC §12.4).'
    StockRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PICKING, PARTIALLY_ISSUED, ISSUED, CANCELLED, CLOSED]
    IssueType:
      type: string
      enum: [BRANCH_ISSUE, WH_TRANSFER, BRANCH_TRANSFER]
      description: '`BRANCH_ISSUE` — anbar → filial; `WH_TRANSFER` — anbar → anbar/alt lokasiya; `BRANCH_TRANSFER` — filial → filial.'
    IssueStatus:
      type: string
      enum: [DRAFT, DISPATCHED, RECEIVED, DISCREPANCY, CANCELLED]
    CountType:
      type: string
      enum: [FULL, CYCLE, SPOT]
    CountStatus:
      type: string
      enum: [DRAFT, FROZEN, COUNTING, REVIEW, APPROVED, POSTED, CANCELLED]
    WasteStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, POSTED, REJECTED]
    SimpleDocStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]
      description: Status sütunu olmayan sənədlər (nümunə) üçün `movementGroupId`-dən törəyən status.
    RtvStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, CLOSED]
    MovementDocType:
      type: string
      enum: [RECEIPT, ISSUE, TRANSFER, COUNT_ADJUST, WASTE, SAMPLE, RETURN, OPENING, REVERSAL]
    SourceDocType:
      type: string
      enum: [PO, GOODS_RECEIPT, STOCK_REQUEST, ISSUE, COUNT, WASTE, SAMPLE, RTV, MOVEMENT_GROUP]
    InventorySettingKey:
      type: string
      enum:
        - expiry_warning_days
        - expiry_critical_days
        - receipt_over_tolerance_pct
        - receipt_under_tolerance_pct
        - costing_method
        - count_variance_approval_threshold_pct
        - block_transactions_during_count
        - require_branch_receipt_confirmation
        - allow_negative_stock

    # --- shared line fragments ---
    ProductRef:
      type: object
      description: Sətirlərdə məhsulun qısa görünüşü (MasterData `ProductSummary`-nin alt çoxluğu).
      required: [id, sku, name, baseUomId, baseUomCode]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        name:
          type: string
        baseUomId:
          $ref: '#/components/schemas/Id'
        baseUomCode:
          type: string
        requiresBatch:
          type: boolean
        requiresExpiry:
          type: boolean

    BatchRef:
      type: object
      required: [id, batchNo, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        batchNo:
          type: string
          maxLength: 64
        expiryDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        status:
          $ref: '#/components/schemas/BatchStatus'

    LocationRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        name:
          type: string
        isVirtual:
          type: boolean

    CostFields:
      type: object
      description: |
        Maya dəyəri sahələri. **Yalnız `master.product.view_cost` icazəsi ilə qaytarılır** — icazəsiz istifadəçi üçün
        bu sahələr cavabda mövcud deyil (SPEC §16). Client `null`/yox halını "gizli" kimi göstərməlidir.
      properties:
        unitCost:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: Base UoM üzrə, tenant valyutasında (AZN).
        totalValue:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: '`qtyBase × unitCost`, AZN.'

    # ================================================================ Goods receipt
    GoodsReceiptSummary:
      type: object
      required: [id, docNo, docDate, supplierId, locationId, qualityStatus, status, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        docNo:
          type: string
          examples: [GR-2026-00311]
        docDate:
          $ref: '#/components/schemas/DateOnly'
        poId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        poDocNo:
          type: [string, 'null']
        supplierId:
          $ref: '#/components/schemas/Id'
        supplierName:
          type: string
        locationId:
          $ref: '#/components/schemas/Id'
        locationName:
          type: string
        qualityStatus:
          $ref: '#/components/schemas/QualityStatus'
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        hasVariance:
          type: boolean
          description: Ən azı bir sətirdə `receivedQty ≠ orderedQty`.
        lineCount:
          type: integer
          format: int32
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    GoodsReceipt:
      allOf:
        - $ref: '#/components/schemas/GoodsReceiptSummary'
        - type: object
          required: [lines, attachmentIds, audit]
          properties:
            temperatureC:
              oneOf:
                - $ref: '#/components/schemas/Decimal'
                - type: 'null'
              description: Qəbul zamanı ölçülən temperatur (°C).
            packagingNote:
              type: [string, 'null']
              maxLength: 500
            movementGroupId:
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              description: POSTED olduqda `RECEIPT` qrupunun id-si.
            postedAt:
              oneOf:
                - $ref: '#/components/schemas/DateTimeUtc'
                - type: 'null'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/GoodsReceiptLine'
            attachmentIds:
              type: array
              items:
                $ref: '#/components/schemas/Id'
              description: Qaimə, sertifikat, foto (Documents modulu).
            audit:
              $ref: '#/components/schemas/AuditFields'

    GoodsReceiptLine:
      type: object
      required: [id, lineNo, product, receivedQty, rejectedQty, uomId, uomCode, acceptedQtyBase]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        lineNo:
          type: integer
          format: int32
        product:
          $ref: '#/components/schemas/ProductRef'
        poLineId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        orderedQty:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: PO-dan; PO-suz qəbulda `null`. `uomId` vahidində.
        receivedQty:
          $ref: '#/components/schemas/Decimal'
          description: Faktiki qəbul edilən (rədd daxil), `uomId` vahidində.
        rejectedQty:
          $ref: '#/components/schemas/Decimal'
          description: Keyfiyyətə görə rədd edilən hissə; ledger-ə yalnız `receivedQty − rejectedQty` düşür.
        uomId:
          $ref: '#/components/schemas/Id'
        uomCode:
          type: string
        acceptedQtyBase:
          $ref: '#/components/schemas/Decimal'
          description: '`(receivedQty − rejectedQty) × conversionRate`, base UoM-da — server hesablayır.'
        batchNo:
          type: [string, 'null']
          maxLength: 64
        batchId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
          description: POSTED sonra yaradılan/tapılan partiya.
        productionDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        expiryDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        unitPrice:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: '`uomId` vahidi üzrə, `currency`-də. **Yalnız `master.product.view_cost` ilə.**'
        currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
          description: Yalnız `master.product.view_cost` ilə.
        varianceNote:
          type: [string, 'null']
          maxLength: 500
          description: '`receivedQty` toleransdan kənar olduqda **məcburi** (SPEC §12.8).'
        varianceQty:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: '`receivedQty − orderedQty` (server).'

    GoodsReceiptLineCreate:
      type: object
      required: [productId, receivedQty, uomId]
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        poLineId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        receivedQty:
          $ref: '#/components/schemas/Decimal'
        rejectedQty:
          $ref: '#/components/schemas/Decimal'
          default: "0"
        uomId:
          $ref: '#/components/schemas/Id'
        batchNo:
          type: [string, 'null']
          maxLength: 64
          description: '`product.requiresBatch` → məcburi.'
        productionDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        expiryDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
          description: '`product.requiresExpiry` → məcburi; keçmiş tarix `422`.'
        unitPrice:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: PO-dan gəlirsə boş buraxılır (server PO qiymətini götürür).
        currency:
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - type: 'null'
        varianceNote:
          type: [string, 'null']
          maxLength: 500

    GoodsReceiptCreate:
      type: object
      required: [docDate, supplierId, locationId, qualityStatus, lines]
      properties:
        docDate:
          $ref: '#/components/schemas/DateOnly'
        poId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        supplierId:
          $ref: '#/components/schemas/Id'
        locationId:
          $ref: '#/components/schemas/Id'
        temperatureC:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        qualityStatus:
          $ref: '#/components/schemas/QualityStatus'
        packagingNote:
          type: [string, 'null']
          maxLength: 500
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GoodsReceiptLineCreate'
        attachmentIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          default: []

    GoodsReceiptUpdate:
      allOf:
        - $ref: '#/components/schemas/GoodsReceiptCreate'
        - type: object
          required: [rowVersion]
          properties:
            rowVersion:
              $ref: '#/components/schemas/RowVersion'

    GoodsReceiptPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GoodsReceiptSummary'

    # ================================================================ Balance
    Balance:
      type: object
      required: [product, location, qtyOnHand, qtyReserved, qtyAvailable, baseUomId, baseUomCode, updatedAt]
      properties:
        product:
          $ref: '#/components/schemas/ProductRef'
        location:
          $ref: '#/components/schemas/LocationRef'
        batch:
          oneOf:
            - $ref: '#/components/schemas/BatchRef'
            - type: 'null'
          description: '`null` = partiyasız qalıq (`batch_id = 0`).'
        qtyOnHand:
          $ref: '#/components/schemas/Decimal'
          description: Base UoM-da.
        qtyReserved:
          $ref: '#/components/schemas/Decimal'
        qtyAvailable:
          $ref: '#/components/schemas/Decimal'
          description: '`qtyOnHand − qtyReserved`.'
        baseUomId:
          $ref: '#/components/schemas/Id'
        baseUomCode:
          type: string
        avgUnitCost:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: Moving average, AZN. **Yalnız `master.product.view_cost` ilə; əks halda sahə yoxdur.**
        totalValue:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: '`qtyOnHand × avgUnitCost`. **Yalnız `master.product.view_cost` ilə.**'
        minStock:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        isBelowMin:
          type: boolean
        daysToExpiry:
          type: [integer, 'null']
          format: int32
        lastMovementId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        updatedAt:
          $ref: '#/components/schemas/DateTimeUtc'

    BalancePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Balance'

    BalanceSummary:
      type: object
      required: [product, qtyOnHand, qtyReserved, qtyAvailable, byLocation]
      properties:
        product:
          $ref: '#/components/schemas/ProductRef'
        qtyOnHand:
          $ref: '#/components/schemas/Decimal'
        qtyReserved:
          $ref: '#/components/schemas/Decimal'
        qtyAvailable:
          $ref: '#/components/schemas/Decimal'
        totalValue:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: Yalnız `master.product.view_cost` ilə.
        byLocation:
          type: array
          items:
            type: object
            required: [location, qtyOnHand, qtyAvailable]
            properties:
              location:
                $ref: '#/components/schemas/LocationRef'
              qtyOnHand:
                $ref: '#/components/schemas/Decimal'
              qtyAvailable:
                $ref: '#/components/schemas/Decimal'

    # ================================================================ Batch
    Batch:
      type: object
      required: [id, product, batchNo, receivedAt, status, qtyOnHand, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product:
          $ref: '#/components/schemas/ProductRef'
        batchNo:
          type: string
          maxLength: 64
        productionDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        expiryDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        supplierId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        receivedAt:
          $ref: '#/components/schemas/DateTimeUtc'
          description: FIFO sırası üçün.
        status:
          $ref: '#/components/schemas/BatchStatus'
        daysToExpiry:
          type: [integer, 'null']
          format: int32
        qtyOnHand:
          $ref: '#/components/schemas/Decimal'
          description: Bütün (görünən) lokasiyalar üzrə cəm, base UoM.
        balances:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: Yalnız `getBatch`-də dolu.
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    BatchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Batch'

    BatchStatusChange:
      type: object
      required: [rowVersion, status, reasonCodeId]
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        status:
          type: string
          enum: [ACTIVE, BLOCKED, QUARANTINE]
        reasonCodeId:
          $ref: '#/components/schemas/Id'
        note:
          type: [string, 'null']
          maxLength: 1000

    # ================================================================ Stock request
    StockRequestSummary:
      type: object
      required: [id, docNo, docDate, fromLocation, toLocation, status, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        docNo:
          type: string
          examples: [SR-2026-01204]
        docDate:
          $ref: '#/components/schemas/DateOnly'
        fromLocation:
          $ref: '#/components/schemas/LocationRef'
        toLocation:
          $ref: '#/components/schemas/LocationRef'
        requiredDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        status:
          $ref: '#/components/schemas/StockRequestStatus'
        lineCount:
          type: integer
          format: int32
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    StockRequest:
      allOf:
        - $ref: '#/components/schemas/StockRequestSummary'
        - type: object
          required: [lines, audit]
          properties:
            note:
              type: [string, 'null']
              maxLength: 1000
            lines:
              type: array
              items:
                $ref: '#/components/schemas/StockRequestLine'
            issueIds:
              type: array
              items:
                $ref: '#/components/schemas/Id'
              description: Bu tələb üzrə yaradılmış məxaric sənədləri.
            audit:
              $ref: '#/components/schemas/AuditFields'

    StockRequestLine:
      type: object
      required: [id, lineNo, product, qty, uomId, uomCode, issuedQty]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        lineNo:
          type: integer
          format: int32
        product:
          $ref: '#/components/schemas/ProductRef'
        qty:
          $ref: '#/components/schemas/Decimal'
        uomId:
          $ref: '#/components/schemas/Id'
        uomCode:
          type: string
        issuedQty:
          $ref: '#/components/schemas/Decimal'
          description: İndiyədək məxaric edilmiş hissə (eyni vahiddə).
        note:
          type: [string, 'null']
          maxLength: 500

    StockRequestLineCreate:
      type: object
      required: [productId, qty, uomId]
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        qty:
          $ref: '#/components/schemas/Decimal'
        uomId:
          $ref: '#/components/schemas/Id'
        note:
          type: [string, 'null']
          maxLength: 500

    StockRequestCreate:
      type: object
      required: [docDate, fromLocationId, toLocationId, lines]
      properties:
        docDate:
          $ref: '#/components/schemas/DateOnly'
        fromLocationId:
          $ref: '#/components/schemas/Id'
        toLocationId:
          $ref: '#/components/schemas/Id'
        requiredDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        note:
          type: [string, 'null']
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StockRequestLineCreate'

    StockRequestUpdate:
      allOf:
        - $ref: '#/components/schemas/StockRequestCreate'
        - type: object
          required: [rowVersion]
          properties:
            rowVersion:
              $ref: '#/components/schemas/RowVersion'

    StockRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StockRequestSummary'

    # ================================================================ Issue
    IssueSummary:
      type: object
      required: [id, docNo, docDate, issueType, fromLocation, toLocation, status, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        docNo:
          type: string
          examples: [IS-2026-00998]
        docDate:
          $ref: '#/components/schemas/DateOnly'
        issueType:
          $ref: '#/components/schemas/IssueType'
        fromLocation:
          $ref: '#/components/schemas/LocationRef'
        toLocation:
          $ref: '#/components/schemas/LocationRef'
        requestId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        requestDocNo:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/IssueStatus'
        dispatchedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTimeUtc'
            - type: 'null'
        receivedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTimeUtc'
            - type: 'null'
        lineCount:
          type: integer
          format: int32
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    Issue:
      allOf:
        - $ref: '#/components/schemas/IssueSummary'
        - type: object
          required: [lines, audit]
          properties:
            dispatchGroupId:
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              description: 'mənbə → `IN_TRANSIT` qrupu.'
            receiptGroupId:
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              description: '`IN_TRANSIT` → hədəf qrupu.'
            receivedBy:
              oneOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
            note:
              type: [string, 'null']
              maxLength: 1000
            lines:
              type: array
              items:
                $ref: '#/components/schemas/IssueLine'
            audit:
              $ref: '#/components/schemas/AuditFields'

    IssueLine:
      type: object
      required: [id, lineNo, product, qty, uomId, uomCode, qtyBase]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        lineNo:
          type: integer
          format: int32
        product:
          $ref: '#/components/schemas/ProductRef'
        requestLineId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        qty:
          $ref: '#/components/schemas/Decimal'
          description: Göndərilən miqdar, `uomId` vahidində.
        uomId:
          $ref: '#/components/schemas/Id'
        uomCode:
          type: string
