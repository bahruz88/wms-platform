        `FROZEN/COUNTING` statusunda; ilk çağırış `COUNTING`-ə keçirir. Göndərilən sətirlər `countId + productId +
        batchId` üzrə **upsert** olunur — mobil tətbiq rəf-rəf göndərə bilər. Server `varianceQty = counted − book`
        və `variancePct` hesablayır. `varianceQty ≠ 0` olan sətirdə `reasonCodeId` (qrup `ADJUSTMENT`) məcburidir
        (`422 REASON_CODE_REQUIRED`, SPEC §12.6). Dondurma anında olmayan məhsul/partiya (`bookQty = 0`) əlavə edilə bilər.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
