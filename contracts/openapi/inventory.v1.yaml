      tags: [Waste]
      x-permission: inv.waste.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WasteCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waste'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /waste/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getWaste
      summary: Tullantı sənədi
      description: Sətirlər və attachment-lər.
      tags: [Waste]
      x-permission: inv.waste.view
      responses:
        '200':
          description: Tullantı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waste'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /waste/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: submitWaste
      summary: Təsdiqə göndər
      description: |
        `DRAFT → PENDING_APPROVAL`. Səbəb kodu `requiresApproval=false` olduqda birbaşa `APPROVED`.
        Approval qaydası `doc_type=WASTE`, məbləğ = `avgUnitCost × qty` (AZN) ilə seçilir.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Waste]
      x-permission: inv.waste.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waste'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /waste/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: approveWaste
      summary: Tullantını təsdiqlə / rədd et
      description: |
        `PENDING_APPROVAL → APPROVED` (`decision=APPROVED`) və ya `→ REJECTED`. `inv.waste.approve` icazəsi (SPEC §7.1).
        Sənədi yaradan özü təsdiqləyə bilməz (`403`).

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Waste]
      x-permission: inv.waste.approve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionBody'
      responses:
        '200':
          description: Qərar verildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waste'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /waste/{id}/post:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: postWaste
      summary: Tullantını ledger-ə yaz
      description: |
        `APPROVED → POSTED`. `WASTE` qrupu: lokasiya −qty, `V_WASTE` +qty; `unitCost` = `avgUnitCost` — beləliklə
        tullantının manat dəyəri ledger-də qalır (SPEC §12.5). `WastePosted` event-i.

        `409` kodları: `INSUFFICIENT_STOCK`, `BATCH_BLOCKED`, `LOCATION_FROZEN`, `STALE_VERSION`,
        `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Waste]
      x-permission: inv.waste.post
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Post edildi; `movementGroupId` dolu.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waste'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================================================================ Samples
  /samples:
    get:
      operationId: listSamples
      summary: AQTA nümunə sənədləri
      description: Nümunə götürmə sənədləri.
      tags: [Samples]
      x-permission: inv.sample.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SimpleDocStatus'
        - $ref: '#/components/parameters/LocationIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Nümunələr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSample
      summary: Nümunə sənədi yarat (DRAFT)
      description: '`authority` default `AQTA`. Səbəb kodu qrupu `SAMPLE`. `409` kodları: `IDEMPOTENT_REPLAY`.'
      tags: [Samples]
      x-permission: inv.sample.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /samples/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getSample
      summary: Nümunə sənədi
      description: Sətirlər daxil.
      tags: [Samples]
      x-permission: inv.sample.view
      responses:
        '200':
          description: Nümunə.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /samples/{id}/post:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: postSample
      summary: Nümunəni ledger-ə yaz
      description: |
        `DRAFT → POSTED`. `SAMPLE` qrupu: lokasiya −qty, `V_SAMPLE` +qty (SPEC §12.3).

        `409` kodları: `INSUFFICIENT_STOCK`, `BATCH_BLOCKED`, `LOCATION_FROZEN`, `STALE_VERSION`,
        `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Samples]
      x-permission: inv.sample.post
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Post edildi.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================================================================ Return to vendor
  /return-to-vendor:
    get:
      operationId: listReturnsToVendor
      summary: Təchizatçıya qaytarma sənədləri
      description: Qaytarmalar; `claimAmount` yalnız `master.product.view_cost` ilə.
      tags: [ReturnToVendor]
      x-permission: inv.rtv.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RtvStatus'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - $ref: '#/components/parameters/LocationIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Qaytarmalar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnToVendorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createReturnToVendor
      summary: Qaytarma sənədi yarat (DRAFT)
      description: |
        `receiptId` verildikdə sətirlər həmin qəbulun partiyaları ilə məhdudlaşır. Səbəb kodu qrupu `RETURN`.

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [ReturnToVendor]
      x-permission: inv.rtv.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToVendorCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnToVendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /return-to-vendor/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getReturnToVendor
      summary: Qaytarma sənədi
      description: Sətirlər daxil.
      tags: [ReturnToVendor]
      x-permission: inv.rtv.view
      responses:
        '200':
          description: Qaytarma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnToVendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /return-to-vendor/{id}/send:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: sendReturnToVendor
      summary: Malı təchizatçıya göndər (ledger-ə yaz)
      description: |
        `DRAFT → SENT`. `RETURN` qrupu: lokasiya −qty, `V_SUPPLIER` +qty (SPEC §12.3); `unitCost` = `avgUnitCost`.

        `409` kodları: `INSUFFICIENT_STOCK`, `BATCH_BLOCKED`, `LOCATION_FROZEN`, `STALE_VERSION`,
        `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [ReturnToVendor]
      x-permission: inv.rtv.post
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi; `movementGroupId` dolu.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnToVendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /return-to-vendor/{id}/close:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: closeReturnToVendor
      summary: Təchizatçı cavabını qeyd et və bağla
      description: |
        `SENT → ACCEPTED | REJECTED → CLOSED` (bir addımda: `outcome` + yekun `claimAmount`). `REJECTED`
        olduqda mal geri qəbul edilirsə ayrıca qəbul sənədi yaradılır.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [ReturnToVendor]
      x-permission: inv.rtv.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnToVendorClose'
      responses:
        '200':
          description: Bağlandı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnToVendor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Ledger
  /movements:
    get:
      operationId: listMovements
      summary: Ledger sorğusu (yalnız oxunur)
      description: |
        `inv_movement` append-only ledger. Hər sətir işarəli `qtyBase` daşıyır (+ mədaxil / − məxaric),
        `conversionRate` hərəkət anında dondurulmuş dəyərdir. Bir qrupun bütün sətirlərini görmək üçün
        `groupId` filtri və ya `getMovementGroup`.

        `unitCost`, `fxRate`, `currency` yalnız `master.product.view_cost` ilə. Auditor bütün lokasiyaları görür.
      tags: [Movements]
      x-permission: inv.movement.view
      parameters:
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/LocationIdFilter'
        - $ref: '#/components/parameters/BatchIdFilter'
        - name: groupId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: docType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MovementDocType'
        - name: docNo
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: postedFrom
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DateTimeUtc'
        - name: postedTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DateTimeUtc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Hərəkət sətirləri.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /movement-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getMovementGroup
      summary: Hərəkət qrupu (sənəd başlığı + sətirlər)
      description: '`lines` cəmi həmişə `0`-dır (ADR-003). `reversedByGroupId` dolu olduqda qrup storno edilib.'
      tags: [Movements]
      x-permission: inv.movement.view
      responses:
        '200':
          description: Qrup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /movement-groups/{id}/reverse:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: reverseMovementGroup
      summary: Storno — qrupu əks işarə ilə təkrarla
      description: |
        Yeni `REVERSAL` qrupu yaradır: orijinalın hər sətri əks işarə ilə (`−qty_base`), eyni `conversionRate` və
        `unitCost` ilə. `reasonCodeId` **məcburidir** (SPEC §12.6), `common_audit_log`-a `REVERSE` yazılır.
        Ledger-də `UPDATE/DELETE` yoxdur — bu, yeganə düzəliş yoludur (SPEC §9.4).

        Mənbə sənədin statusu dəyişmir; `Issue` üçün yalnız `RECEIVED` olmayan `dispatchGroupId` storno edilə bilər.

        `409` kodları:
        * `INSUFFICIENT_STOCK` — mal artıq məxaric olunub, storno mənfi balans yaradar;
        * `LOCATION_FROZEN`; `BATCH_BLOCKED`;
        * `INVALID_STATE_TRANSITION` — qrup artıq storno edilib və ya özü `REVERSAL`-dır;
        * `IDEMPOTENT_REPLAY`.
      tags: [Movements]
      x-permission: inv.movement.reverse
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementGroupReverse'
      responses:
        '201':
          description: Storno qrupu yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Settings
  /settings:
    get:
      operationId: listInventorySettings
      summary: Inventory parametrləri
      description: '`inv_setting` açar/dəyər siyahısı (expiry günləri, tolerans faizləri, costing metodu...) — SPEC §9.1.'
      tags: [Settings]
      x-permission: inv.settings.view
      responses:
        '200':
          description: Parametrlər.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventorySetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InventorySettingKey'
    put:
      operationId: updateInventorySetting
      summary: Parametri dəyiş
      description: Dəyər açarın tipinə görə validasiya olunur (`422`); dəyişiklik audit-ə düşür.
      tags: [Settings]
      x-permission: inv.settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySettingUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

