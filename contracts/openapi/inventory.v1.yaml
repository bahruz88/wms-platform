openapi: 3.1.0
info:
  title: WMS Inventory API
  version: 1.0.0
  summary: Partiya, ledger, balans, qəbul, məxaric/transfer, sayım, tullantı, nümunə, qaytarma, storno (SPEC §9, §12).
  description: |
    Inventory modulu **bölünmür** (ADR-002): bütün sənədlər eyni balans/partiya cədvəllərinə tək ACID
    tranzaksiyada toxunur. Hər post edilən sənəd bir `movement_group` yaradır, hər qrupun `qty_base` cəmi
    sıfırdır (ADR-003), balans yalnız ledger-dən törəyir (ADR-004).

    Ortaq qaydalar:
    * Miqdarlar **string** `Decimal`-dır. İstifadəçinin daxil etdiyi miqdar `Quantity {value, uomId}`,
      server `qtyBase`-i `factorToBase` ilə hesablayıb əmsalı hərəkətdə dondurur (SPEC §12.1).
    * Maya dəyəri sahələri (`unitCost`, `avgUnitCost`, `totalValue`, `unitPrice`) **yalnız**
      `master.product.view_cost` icazəsi olan istifadəçiyə qaytarılır; icazə yoxdursa sahə JSON-da
      **olmur** (SPEC §16). Sxemdə bu sahələr nullable və qeyri-məcburidir.
    * `FROZEN` sayımı olan lokasiyada `RECEIPT/ISSUE/TRANSFER/WASTE/SAMPLE` post-u `409 LOCATION_FROZEN` (SPEC §12.7).
    * Mənfi balans qadağandır → `409 INSUFFICIENT_STOCK`; `BLOCKED/EXPIRED/QUARANTINE` partiya → `409 BATCH_BLOCKED`.
    * Ledger `UPDATE/DELETE` yoxdur — səhv yalnız `POST /movement-groups/{id}/reverse` ilə düzəlir (SPEC §9.4).

    Route prefiksi: `/api/v1/inventory`. Cədvəl prefiksi: `inv_`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1/inventory
    description: Gateway (YARP) arxasında Inventory modulu

security:
  - bearer: []
  - oidc: []

tags:
  - name: GoodsReceipts
    description: Anbara qəbul (`inv_goods_receipt`), TOR §12. Post → `RECEIPT` qrupu (`V_SUPPLIER` − / anbar +).
  - name: Balances
    description: Balans proyeksiyası (`inv_balance`), yalnız oxunur.
  - name: Batches
    description: Partiyalar (`inv_batch`) — FEFO/FIFO, expiry, blok.
  - name: StockRequests
    description: Filial qida/mal tələbi (`inv_stock_request`), TOR §16.
  - name: Issues
    description: Məxaric və transfer (`inv_issue`) — `IN_TRANSIT` mexanizmi ilə iki addımlı.
  - name: Counts
    description: İnventarizasiya (`inv_count`), TOR §21 — dondurma, sayım, fərq, təsdiq, `COUNT_ADJUST`.
  - name: Waste
    description: Tullantı (`inv_waste`), TOR §22 — səbəb kodu, foto, approval, `V_WASTE`.
  - name: Samples
    description: AQTA nümunəsi (`inv_sample`), TOR §23 — `V_SAMPLE`.
  - name: ReturnToVendor
    description: Təchizatçıya qaytarma (`inv_return_to_vendor`) — `RETURN` qrupu.
  - name: Movements
    description: Ledger (`inv_movement`) və hərəkət qrupları (`inv_movement_group`); storno.
  - name: Settings
    description: Inventory parametrləri (`inv_setting`), SPEC §9.1.

paths:
  # ================================================================ Goods receipts
  /goods-receipts:
    get:
      operationId: listGoodsReceipts
      summary: Qəbul sənədləri
      description: Filial istifadəçisi yalnız öz lokasiyalarına aid qəbulları görür.
      tags: [GoodsReceipts]
      x-permission: inv.receipt.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReceiptStatus'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - $ref: '#/components/parameters/LocationIdFilter'
        - name: poId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Qəbullar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceiptPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createGoodsReceipt
      summary: Qəbul sənədi yarat (DRAFT)
      description: |
        PO-dan (`poId`) və ya PO-suz qəbul. `poId` verildikdə sətirlər `poLineId` ilə bağlanır və `orderedQty`
        PO-dan doldurulur. Sənəd nömrəsi (`GR-2026-00311`) server tərəfindən verilir.

        Validasiya (`422`):
        * `product.requiresBatch` → `batchNo` məcburi; `product.requiresExpiry` → `expiryDate` məcburi;
        * `receivedQty < orderedQty × (1 − under_tolerance_pct/100)` → `varianceNote` məcburi (`VARIANCE_NOTE_REQUIRED`, SPEC §12.8);
        * `rejectedQty ≤ receivedQty`; `qualityStatus=REJECTED` olduqda bütün sətirlərdə `rejectedQty = receivedQty`;
        * qida məhsulu üçün supplier `isApprovedFoodSupplier=true` olmalıdır (TOR §7).

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [GoodsReceipts]
      x-permission: inv.receipt.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsReceiptCreate'
      responses:
        '201':
          description: Yaradıldı (DRAFT).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /goods-receipts/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getGoodsReceipt
      summary: Qəbul sənədi
      description: Sətirlər daxil. `unitPrice`/`currency` yalnız `master.product.view_cost` ilə.
      tags: [GoodsReceipts]
      x-permission: inv.receipt.view
      responses:
        '200':
          description: Qəbul.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateGoodsReceipt
      summary: DRAFT qəbulu yenilə
      description: |
        Yalnız `DRAFT` statusunda; sətirlər tam əvəz olunur. Eyni validasiya `createGoodsReceipt` kimi.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`.
      tags: [GoodsReceipts]
      x-permission: inv.receipt.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsReceiptUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /goods-receipts/{id}/post:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: postGoodsReceipt
      summary: Qəbulu post et (ledger-ə yaz)
      description: |
        `DRAFT → POSTED`. Tək tranzaksiyada (SPEC §12.2): partiya yaradılır/tapılır, `RECEIPT` qrupu və
        sətirləri (`V_SUPPLIER` −qty, anbar +qty) yazılır, balans `FOR UPDATE` ilə yenilənir, moving average
        yenidən hesablanır, `GoodsReceiptPosted` (+ fərq varsa `ReceiptVarianceDetected`) outbox-a düşür.

        `409` kodları:
        * `LOCATION_FROZEN` — lokasiyada FROZEN sayım var (SPEC §12.7);
        * `FX_RATE_MISSING` — xarici valyutada qəbul, PO tarixinə məzənnə yoxdur (SPEC §12.5);
        * `APPROVAL_REQUIRED` — `receivedQty > orderedQty × (1 + over_tolerance_pct/100)`, əvvəl approval lazımdır (SPEC §12.8);
        * `BATCH_BLOCKED` — mövcud partiya `BLOCKED/QUARANTINE` statusundadır;
        * `STALE_VERSION`, `INVALID_STATE_TRANSITION` (artıq POSTED/CANCELLED), `IDEMPOTENT_REPLAY`.
      tags: [GoodsReceipts]
      x-permission: inv.receipt.post
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Post edildi; `movementGroupId` dolu.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /goods-receipts/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: cancelGoodsReceipt
      summary: DRAFT qəbulu ləğv et
      description: '`DRAFT → CANCELLED`. POSTED sənəd ləğv edilmir — storno (`reverseMovementGroup`) istifadə olunur. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [GoodsReceipts]
      x-permission: inv.receipt.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Ləğv edildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================================================================ Balances
  /balances:
    get:
      operationId: listBalances
      summary: Balans (qalıq) sorğusu
      description: |
        `inv_balance` proyeksiyası. `qtyAvailable = qtyOnHand − qtyReserved`. Default olaraq sıfır qalıqlar
        gizlədilir (`includeZero=false`). Filial istifadəçisi üçün `locationId` filtri `iam_user_location` ilə
        məhdudlaşdırılır; virtual lokasiyalar yalnız `inv.balance.view_virtual` icazəsi ilə görünür.

        **Maya dəyəri:** `avgUnitCost`, `totalValue` yalnız `master.product.view_cost` ilə qaytarılır;
        əks halda JSON-da yoxdur.
      tags: [Balances]
      x-permission: inv.balance.view
      parameters:
        - $ref: '#/components/parameters/LocationIdFilter'
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/BatchIdFilter'
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: includeZero
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: belowMin
          in: query
          required: false
          description: Yalnız `qtyOnHand < product.minStock` olanlar (lokasiya üzrə cəm).
          schema:
            type: boolean
        - name: expiringWithinDays
          in: query
          required: false
          description: Partiyanın son istifadə tarixi N gün içində olanlar.
          schema:
            type: integer
            format: int32
            minimum: 0
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Balans sətirləri.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /balances/summary:
    get:
      operationId: getBalanceSummary
      summary: Məhsul üzrə cəmlənmiş balans
      description: Bir məhsulun bütün (görünən) lokasiyalar və partiyalar üzrə cəmi — məxaric formasında "mövcud" göstəricisi üçün.
      tags: [Balances]
      x-permission: inv.balance.view
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/LocationIdFilter'
      responses:
        '200':
          description: Cəm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ================================================================ Batches
  /batches:
    get:
      operationId: listBatches
      summary: Partiyalar
      description: '`status`, `productId`, `expiryBefore` filtrləri. Default sıralama FEFO (`expiryDate`, `receivedAt`).'
      tags: [Batches]
      x-permission: inv.batch.view
      parameters:
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - name: expiryBefore
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DateOnly'
        - name: batchNo
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Partiyalar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /batches/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getBatch
      summary: Partiya
      description: Partiya və lokasiyalar üzrə qalıqları.
      tags: [Batches]
      x-permission: inv.batch.view
      responses:
        '200':
          description: Partiya.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /batches/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: changeBatchStatus
      summary: Partiya statusunu dəyiş (blok / karantin / aktiv)
      description: |
        `ACTIVE ↔ BLOCKED ↔ QUARANTINE`. `EXPIRED` yalnız `ExpiryScanner` job-u tərəfindən verilir və əl ilə
        geri qaytarıla bilmir (`409 INVALID_STATE_TRANSITION`). Səbəb kodu məcburidir, audit-ə düşür.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [Batches]
      x-permission: inv.batch.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStatusChange'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Stock requests
  /stock-requests:
    get:
      operationId: listStockRequests
      summary: Filial tələbləri
      description: Filial istifadəçisi yalnız `toLocationId` öz lokasiyası olanları görür; anbardar hamısını.
      tags: [StockRequests]
      x-permission: inv.request.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockRequestStatus'
        - name: fromLocationId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: toLocationId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Tələblər.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStockRequest
      summary: Tələb yarat (DRAFT)
      description: |
        Filial (`toLocationId`) mərkəzi anbardan (`fromLocationId`) mal tələb edir. `toLocationId` istifadəçinin
        lokasiya siyahısında olmalıdır. Sənəd nömrəsi `SR-2026-01204`.

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [StockRequests]
      x-permission: inv.request.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockRequestCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /stock-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getStockRequest
      summary: Tələb
      description: Tələb və sətirləri (`issuedQty` ilə).
      tags: [StockRequests]
      x-permission: inv.request.view
      responses:
        '200':
          description: Tələb.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStockRequest
      summary: DRAFT tələbi yenilə
      description: 'Yalnız `DRAFT`. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`.'
      tags: [StockRequests]
      x-permission: inv.request.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockRequestUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /stock-requests/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: submitStockRequest
      summary: Tələbi göndər
      description: '`DRAFT → SUBMITTED`; anbardara bildiriş gedir. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [StockRequests]
      x-permission: inv.request.submit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /stock-requests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: cancelStockRequest
      summary: Tələbi ləğv et
      description: '`DRAFT/SUBMITTED → CANCELLED`; `PICKING` və sonrası ləğv edilmir. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [StockRequests]
      x-permission: inv.request.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
