      operationId: submitCount
      summary: Sayımı yoxlamaya göndər
      description: |
        `COUNTING → REVIEW`. Bütün sətirlərdə `countedQty` dolu olmalıdır (`422`). `variancePct` üzrə
        `count_variance_approval_threshold_pct`-dən yuxarı sətir varsa `requiresApproval=true` işarələnir və
        approval instansı (`doc_type=COUNT_ADJUST`) yaradılır (SPEC §12.6).

