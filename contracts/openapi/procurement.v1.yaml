        deliveryLocation:
          $ref: '#/components/schemas/LocationRef'
        expectedDate:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        lines:
          type: array
          items:
            type: object
            required: [id, lineNo, product, qty, uomId, uomCode, receivedQty, remainingQty]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              lineNo:
                type: integer
                format: int32
              product:
                $ref: '#/components/schemas/ProductRef'
              qty:
                $ref: '#/components/schemas/Decimal'
              uomId:
                $ref: '#/components/schemas/Id'
              uomCode:
                type: string
              receivedQty:
                $ref: '#/components/schemas/Decimal'
              remainingQty:
                $ref: '#/components/schemas/Decimal'

    OpenPurchaseOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OpenPurchaseOrder'

    # ================================================================ Approvals
    ApprovalInstance:
      type: object
      required: [id, docType, docId, docNo, currentStep, status, steps]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        docType:
          $ref: '#/components/schemas/ApprovalDocType'
        docId:
          $ref: '#/components/schemas/Id'
        docNo:
          type: string
        amountBase:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: Qaydanın seçilməsində istifadə olunan AZN məbləğ.
        currentStep:
          type: integer
          format: int32
          minimum: 1
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
        createdAt:
          $ref: '#/components/schemas/DateTimeUtc'

    ApprovalStep:
      type: object
      required: [id, stepNo, approverRoleCode, decision]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        stepNo:
          type: integer
          format: int32
        approverRoleCode:
          type: string
          description: Qaydadan gələn rol.
        approverUser:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: Qərar verən (və ya təyin olunmuş) istifadəçi.
        delegatedFromUser:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: Qərar delegasiya ilə verilibsə əsl təsdiqləyən.
        decision:
          $ref: '#/components/schemas/StepDecision'
        decidedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTimeUtc'
            - type: 'null'
        comment:
          type: [string, 'null']
          maxLength: 1000

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        comment:
          type: [string, 'null']
          maxLength: 1000
          description: '`REJECTED` üçün məcburi.'
        expectedStepNo:
          type: [integer, 'null']
          format: int32
          description: Verilərsə cari addımla üst-üstə düşməlidir (`409 INVALID_STATE_TRANSITION`) — köhnə ekrandan qərar verməyin qarşısını alır.

    PendingApproval:
      type: object
      required: [approvalId, stepId, docType, docId, docNo, stepNo, waitingSince]
      properties:
        approvalId:
          $ref: '#/components/schemas/Id'
        stepId:
          $ref: '#/components/schemas/Id'
        docType:
          $ref: '#/components/schemas/ApprovalDocType'
        docId:
          $ref: '#/components/schemas/Id'
        docNo:
          type: string
        stepNo:
          type: integer
          format: int32
        amountBase:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        summary:
          type: string
          description: Qısa təsvir (təchizatçı / lokasiya / sətir sayı).
        requestedBy:
          $ref: '#/components/schemas/UserRef'
        viaDelegationFrom:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: Bu qərar sizə delegasiya ilə gəlibsə — kimdən.
        waitingSince:
          $ref: '#/components/schemas/DateTimeUtc'

    PendingApprovalPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PendingApproval'

    ApprovalRule:
      type: object
      required: [id, docType, productType, minAmountBase, stepNo, approverRoleId, approverRoleCode, isActive, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        docType:
          $ref: '#/components/schemas/ApprovalDocType'
        productType:
          type: string
          enum: [FOOD, NON_FOOD, ANY]
        minAmountBase:
          $ref: '#/components/schemas/Decimal'
        maxAmountBase:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
          description: '`null` = limitsiz.'
        stepNo:
          type: integer
          format: int32
          minimum: 1
        approverRoleId:
          $ref: '#/components/schemas/Id'
        approverRoleCode:
          type: string
        isActive:
          type: boolean
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    ApprovalRuleCreate:
      type: object
      required: [docType, productType, minAmountBase, stepNo, approverRoleId]
      properties:
        docType:
          $ref: '#/components/schemas/ApprovalDocType'
        productType:
          type: string
          enum: [FOOD, NON_FOOD, ANY]
          default: ANY
        minAmountBase:
          $ref: '#/components/schemas/Decimal'
        maxAmountBase:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        stepNo:
          type: integer
          format: int32
          minimum: 1
        approverRoleId:
          $ref: '#/components/schemas/Id'

    ApprovalRuleUpdate:
      allOf:
        - $ref: '#/components/schemas/ApprovalRuleCreate'
        - type: object
          required: [isActive, rowVersion]
          properties:
            isActive:
              type: boolean
            rowVersion:
              $ref: '#/components/schemas/RowVersion'

    # ================================================================ Price history
    PriceHistoryEntry:
      type: object
      required: [id, product, supplier, priceDate, unitPrice, currency, unitPriceBase]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product:
          $ref: '#/components/schemas/ProductRef'
        supplier:
          $ref: '#/components/schemas/SupplierRef'
        poId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        poDocNo:
          type: [string, 'null']
        priceDate:
          $ref: '#/components/schemas/DateOnly'
        unitPrice:
          $ref: '#/components/schemas/Decimal'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        unitPriceBase:
          $ref: '#/components/schemas/Decimal'
          description: AZN, base UoM üzrə.
        prevPriceBase:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        diffAmount:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        diffPct:
          oneOf:
            - $ref: '#/components/schemas/Percent'
            - type: 'null'

    PriceHistoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PriceHistoryEntry'
