        qty:
          $ref: '#/components/schemas/Decimal'
        uomId:
          $ref: '#/components/schemas/Id'
        note:
          type: [string, 'null']
          maxLength: 500

    RequisitionCreate:
      type: object
      required: [docDate, requesterLocationId, productType, lines]
