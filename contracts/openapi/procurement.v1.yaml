openapi: 3.1.0
info:
  title: WMS Procurement API
  version: 1.0.0
  summary: PR → RFQ → Quotation → Comparison → PO → Approval; qiymət tarixçəsi (SPEC §10).
  description: |
    Procurement modulu satınalma axınını idarə edir. Əsas qaydalar:

    * PR avtomatik PO-ya çevrilmir (TOR §9); bir PO bir neçə PR sətrindən yığıla bilər,
      `RequisitionLine.convertedQty` qismən çevrilməni izləyir (SPEC §12.8).
    * Ən ucuz təklif seçilmədikdə `selectionNote` **məcburidir** (`422 SELECTION_NOTE_REQUIRED`).
    * PO approval-ı parametrik qaydalarla (`proc_approval_rule`: sənəd tipi, məhsul tipi, AZN məbləğ intervalı,
      addım, təsdiqləyən rol) və delegasiya (`iam_delegation`) ilə işləyir (TOR §10, §36).
    * `totalAmountBase` (AZN) PO tarixindəki CBAR məzənnəsi ilə hesablanır; məzənnə yoxdursa `409 FX_RATE_MISSING`.
    * Bütün məbləğlər **string** `Decimal`-dır.

    Route prefiksi: `/api/v1/procurement`. Cədvəl prefiksi: `proc_`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1/procurement
    description: Gateway (YARP) arxasında Procurement modulu

security:
  - bearer: []
  - oidc: []

tags:
  - name: Requisitions
    description: Satınalma tələbi — PR (`proc_requisition`).
  - name: Rfqs
    description: Qiymət sorğusu — RFQ (`proc_rfq`) və təchizatçılara göndərilməsi.
  - name: Quotations
    description: Təchizatçı təklifləri (`proc_quotation`) və müqayisə cədvəli.
  - name: PurchaseOrders
    description: Sifariş — PO (`proc_purchase_order`), TOR §10.
  - name: Approvals
    description: Approval instansları və addımları (`proc_approval_instance/step`); gözləyən qərarlar.
  - name: ApprovalRules
    description: Parametrik approval qaydaları (`proc_approval_rule`).
  - name: PriceHistory
    description: Qiymət tarixçəsi (`proc_price_history`), TOR §25.

paths:
  # ================================================================ Requisitions
  /requisitions:
    get:
      operationId: listRequisitions
      summary: PR siyahısı
      description: Filial istifadəçisi yalnız `requesterLocationId` öz lokasiyası olanları görür.
      tags: [Requisitions]
      x-permission: proc.pr.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequisitionStatus'
        - name: productType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Priority'
        - name: requesterLocationId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: PR-lar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRequisition
      summary: PR yarat (DRAFT)
      description: |
        Bir PR yalnız bir `productType` (FOOD / NON_FOOD) daşıyır — sətirlərdəki məhsullar uyğun gəlməlidir (`422`).
        Sənəd nömrəsi `PR-2026-00142`.

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [Requisitions]
      x-permission: proc.pr.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /requisitions/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getRequisition
      summary: PR
      description: Sətirlər `convertedQty` ilə.
      tags: [Requisitions]
      x-permission: proc.pr.view
      responses:
        '200':
          description: PR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRequisition
      summary: DRAFT PR-ı yenilə
      description: 'Yalnız `DRAFT`. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`.'
      tags: [Requisitions]
      x-permission: proc.pr.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /requisitions/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: submitRequisition
      summary: PR-ı satınalmaya göndər
      description: '`DRAFT → SUBMITTED`; satınalma mütəxəssisinə bildiriş. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [Requisitions]
      x-permission: proc.pr.submit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /requisitions/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: rejectRequisition
      summary: PR-ı rədd et
      description: '`SUBMITTED/IN_PROCUREMENT → REJECTED`; `comment` məcburidir (`422`). `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [Requisitions]
      x-permission: proc.pr.reject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Rədd edildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /requisitions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: cancelRequisition
      summary: PR-ı ləğv et
      description: '`DRAFT/SUBMITTED → CANCELLED` (tələbçi tərəfindən). `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [Requisitions]
      x-permission: proc.pr.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Ləğv edildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================================================================ RFQs
  /rfqs:
    get:
      operationId: listRfqs
      summary: RFQ siyahısı
      description: Qiymət sorğuları.
      tags: [Rfqs]
      x-permission: proc.rfq.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RfqStatus'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: RFQ-lar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createRfq
      summary: RFQ yarat (DRAFT)
      description: |
        Sətirlər PR sətirlərindən (`requisitionLineIds`) və/yaxud əl ilə. Ən azı **iki** təchizatçı seçilməlidir
        (TOR: müqayisə tələbi) — əks halda `422`. Bağlanan PR-lar `IN_PROCUREMENT` statusuna keçir.

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [Rfqs]
      x-permission: proc.rfq.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfqCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /rfqs/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getRfq
      summary: RFQ
      description: Sətirlər, dəvət olunan təchizatçılar və daxil olan təkliflərin sayı.
      tags: [Rfqs]
      x-permission: proc.rfq.view
      responses:
        '200':
          description: RFQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rfqs/{id}/send:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: sendRfq
      summary: RFQ-nu təchizatçılara göndər
      description: '`DRAFT → SENT`; e-mail göndərişi Notification modulunun işidir (event). `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [Rfqs]
      x-permission: proc.rfq.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rfqs/{id}/close:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: closeRfq
      summary: RFQ-nu bağla
      description: '`SENT → CLOSED`; bundan sonra yeni təklif qəbul edilmir. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [Rfqs]
      x-permission: proc.rfq.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Bağlandı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rfqs/{id}/comparison:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getRfqComparison
      summary: Təkliflərin müqayisə cədvəli
      description: |
        RFQ sətirləri × təchizatçı matrisi: hər hüceyrədə qiymət, AZN-ə çevrilmiş qiymət, çatdırılma günü.
        `cheapestQuotationId` — ümumi AZN cəmi ən aşağı olan təklif; `selectQuotation` bu id-dən fərqli seçim
        üçün `selectionNote` tələb edir. Əvvəlki qiymət (`prevPriceBase`) və fərq faizi qiymət tarixçəsindən gəlir.
      tags: [Quotations]
      x-permission: proc.quotation.view
      responses:
        '200':
          description: Müqayisə.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfqComparison'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ================================================================ Quotations
  /quotations:
    get:
      operationId: listQuotations
      summary: Təklif siyahısı
      description: RFQ və/yaxud təchizatçı üzrə.
      tags: [Quotations]
      x-permission: proc.quotation.view
      parameters:
        - name: rfqId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - name: isSelected
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Təkliflər.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createQuotation
      summary: Təchizatçı təklifini daxil et
      description: |
        Satınalma mütəxəssisi təchizatçıdan gələn təklifi (PDF `attachmentIds` ilə) daxil edir. `rfqId` verildikdə
        sətirlər RFQ sətirlərinə (`rfqLineId`) bağlanır və RFQ `SENT` statusunda olmalıdır. `totalAmount` server
        tərəfindən sətirlərdən hesablanır; `totalAmountBase` üçün `quoteDate` məzənnəsi lazımdır.

        `409` kodları: `FX_RATE_MISSING`, `INVALID_STATE_TRANSITION` (RFQ bağlıdır), `IDEMPOTENT_REPLAY`.
      tags: [Quotations]
      x-permission: proc.quotation.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getQuotation
      summary: Təklif
      description: Sətirlər daxil.
      tags: [Quotations]
      x-permission: proc.quotation.view
      responses:
        '200':
          description: Təklif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateQuotation
      summary: Təklifi yenilə
      description: 'Yalnız seçilməmiş (`isSelected=false`) və RFQ bağlanmamış təklif. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `FX_RATE_MISSING`.'
      tags: [Quotations]
      x-permission: proc.quotation.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /quotations/{id}/select:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: selectQuotation
      summary: Təklifi seç (PO üçün əsas)
      description: |
        Eyni RFQ-da əvvəl seçilmiş təklif varsa seçim ondan götürülür. **Bu təklif ən ucuz deyilsə
        `selectionNote` məcburidir** — boşdursa `422 SELECTION_NOTE_REQUIRED` (SPEC §10, `proc_quotation.selection_note`).
        Seçim `common_audit_log`-a yazılır.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION` (RFQ `CLOSED`/`CANCELLED`), `IDEMPOTENT_REPLAY`.
      tags: [Quotations]
      x-permission: proc.quotation.select
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationSelect'
      responses:
        '200':
          description: Seçildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Purchase orders
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: PO siyahısı
      description: Məbləğlər (`totalAmount`, `totalAmountBase`) `proc.po.view` ilə görünür (satınalma rolları); anbardar PO-nu yalnız qəbul üçün `listOpenPurchaseOrdersForReceipt` ilə görür.
      tags: [PurchaseOrders]
      x-permission: proc.po.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseOrderStatus'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - name: deliveryLocationId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: productType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductType'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: PO-lar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPurchaseOrder
      summary: PO yarat (DRAFT)
      description: |
        Mənbə: seçilmiş təklif (`quotationId` — sətirlər və qiymətlər ondan), PR sətirləri (`requisitionLineIds`)
        və ya əl ilə. `fxRate` PO tarixindəki `master_currency_rate`-dən götürülüb **dondurulur**; AZN üçün `1`.
        `subtotal`, `vatAmount`, `totalAmount`, `totalAmountBase` server hesablayır.

        Qida məhsulu üçün supplier `isApprovedFoodSupplier=true` olmalıdır (`422`). Bir PO bir `productType`.
        PR bölünməsinə nəzarət: eyni təchizatçı üzrə pəncərədəki kumulyativ məbləğ approval limitini aşırsa
        `splitCheckWarning` doldurulur (SoD, `proc_split_check_log`).

        `409` kodları: `FX_RATE_MISSING`, `IDEMPOTENT_REPLAY`.
      tags: [PurchaseOrders]
      x-permission: proc.po.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreate'
      responses:
        '201':
          description: Yaradıldı.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/open-for-receipt:
    get:
      operationId: listOpenPurchaseOrdersForReceipt
      summary: Qəbul üçün açıq PO-lar (anbardar görünüşü)
      description: |
        `SENT_TO_SUPPLIER` / `PARTIALLY_RECEIVED` statuslu PO-lar, qalıq miqdarla (`qty − receivedQty`).
        **Qiymət sahələri yoxdur** — anbardar üçün nəzərdə tutulub (`master.product.view_cost` tələb olunmur).
      tags: [PurchaseOrders]
      x-permission: proc.po.view_for_receipt
      parameters:
        - $ref: '#/components/parameters/SupplierIdFilter'
        - name: deliveryLocationId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Açıq PO-lar (qiymətsiz).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPurchaseOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /purchase-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getPurchaseOrder
      summary: PO
      description: Sətirlər, approval vəziyyəti, qəbul tarixçəsi.
      tags: [PurchaseOrders]
      x-permission: proc.po.view
      responses:
        '200':
          description: PO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePurchaseOrder
      summary: DRAFT PO-nu yenilə
      description: 'Yalnız `DRAFT` (rədd edildikdən sonra da `DRAFT`-a qayıdır). `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `FX_RATE_MISSING`.'
      tags: [PurchaseOrders]
      x-permission: proc.po.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: submitPurchaseOrder
      summary: PO-nu təsdiqə göndər
      description: |
        `DRAFT → PENDING_APPROVAL`. Server `proc_approval_rule`-dan `doc_type=PO`, `productType`, `totalAmountBase`
        intervalına uyğun addımları seçir və `ApprovalInstance` yaradır; hər addım üçün təsdiqləyən rol və
        (delegasiya varsa) əvəzedici istifadəçi təyin olunur. Uyğun qayda tapılmazsa `422`
        (`errors.approval: ["Qayda tapılmadı"]`). Məbləğ 0-dan böyük olmalıdır.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `FX_RATE_MISSING`, `IDEMPOTENT_REPLAY`.
      tags: [PurchaseOrders]
      x-permission: proc.po.submit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Təsdiqə göndərildi; `approval` dolu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: approvePurchaseOrder
      summary: Cari approval addımını təsdiqlə
      description: |
        `decideApproval`-ın PO üçün qısa yolu. Cari addımın təsdiqləyəni (rol üzrə) və ya ona delegasiya
        edilmiş istifadəçi çağıra bilər; PO-nu yaradan özü təsdiqləyə bilməz (SoD, `403`).
        Son addım təsdiqlənəndə `PENDING_APPROVAL → APPROVED`, `PurchaseOrderApproved` event-i.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [PurchaseOrders]
      x-permission: proc.po.approve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Addım təsdiqləndi (və ya PO tam təsdiqləndi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: rejectPurchaseOrder
      summary: PO-nu rədd et
      description: '`PENDING_APPROVAL → REJECTED`; `comment` məcburidir (`422`). Yaradan sonra `DRAFT`-a qaytarıb düzəldə bilər. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [PurchaseOrders]
      x-permission: proc.po.approve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Rədd edildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/{id}/send:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: sendPurchaseOrder
      summary: PO-nu təchizatçıya göndər
      description: |
        `APPROVED → SENT_TO_SUPPLIER`; `sentAt` yazılır, PDF generasiyası və e-mail Notification/Documents ilə.
        Təsdiqlənməmiş PO göndərilə bilməz — `409 APPROVAL_REQUIRED`.

        `409` kodları: `APPROVAL_REQUIRED`, `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [PurchaseOrders]
      x-permission: proc.po.send
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedAction'
      responses:
        '200':
          description: Göndərildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /purchase-orders/{id}/close:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: closePurchaseOrder
      summary: PO-nu bağla
      description: |
        `PARTIALLY_RECEIVED / FULLY_RECEIVED → CLOSED` (qalan miqdar gözlənilmir). `SENT_TO_SUPPLIER`-dən
        birbaşa bağlamaq üçün `comment` məcburidir. Bağlı PO-ya qəbul yaradıla bilməz.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.
      tags: [PurchaseOrders]
      x-permission: proc.po.close
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Bağlandı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /purchase-orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: cancelPurchaseOrder
      summary: PO-nu ləğv et
      description: '`DRAFT / REJECTED / APPROVED → CANCELLED`; göndərilmiş PO ləğv edilmir, bağlanır. `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION`, `IDEMPOTENT_REPLAY`.'
      tags: [PurchaseOrders]
      x-permission: proc.po.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedComment'
      responses:
        '200':
          description: Ləğv edildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================================================================ Approvals
  /approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: Mənim gözləyən qərarlarım
      description: |
        Cari istifadəçinin (rol üzrə və ya delegasiya ilə) qərar verməli olduğu açıq approval addımları —
        PO, tullantı (`WASTE`) və sayım düzəlişi (`COUNT_ADJUST`) daxil. Mobil "Təsdiqlər" ekranı bunu istifadə edir.
      tags: [Approvals]
      x-permission: proc.approval.view
      parameters:
        - name: docType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApprovalDocType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Gözləyən addımlar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApprovalPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getApproval
      summary: Approval instansı
      description: Bütün addımlar, qərarlar, şərhlər və delegasiya izi.
      tags: [Approvals]
      x-permission: proc.approval.view
      responses:
        '200':
          description: Instans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approvals/{id}/decide:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: decideApproval
      summary: Cari addım üzrə qərar ver
      description: |
        Ümumi qərar endpoint-i (PO / WASTE / COUNT_ADJUST). Çağıran cari addımın təsdiqləyən roluna malik olmalı
        və ya həmin rol sahibindən qüvvədə olan delegasiyaya sahib olmalıdır; delegasiya ilə verilən qərarda
        `delegatedFromUserId` yazılır. Sənədi yaradan qərar verə bilməz (`403`). `REJECTED` üçün `comment` məcburi.

        `409` kodları: `STALE_VERSION`, `INVALID_STATE_TRANSITION` (addım artıq qərarlanıb), `IDEMPOTENT_REPLAY`.
      tags: [Approvals]
      x-permission: proc.approval.decide
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Qərar yazıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Approval rules
  /approval-rules:
    get:
      operationId: listApprovalRules
      summary: Approval qaydaları
      description: Sənəd tipi, məhsul tipi, AZN interval, addım, rol.
      tags: [ApprovalRules]
      x-permission: proc.approval_rule.view
      parameters:
        - name: docType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApprovalDocType'
        - $ref: '#/components/parameters/IsActiveFilter'
      responses:
        '200':
          description: Qaydalar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApprovalRule
      summary: Qayda yarat
      description: 'Eyni `(docType, productType, stepNo)` üçün intervallar üst-üstə düşməməlidir (`422`). `409` kodları: `IDEMPOTENT_REPLAY`.'
      tags: [ApprovalRules]
      x-permission: proc.approval_rule.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleCreate'
      responses:
        '201':
          description: Yaradıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /approval-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    put:
      operationId: updateApprovalRule
      summary: Qaydanı yenilə
      description: 'Mövcud açıq approval instansları köhnə qayda ilə davam edir. `409` kodları: `STALE_VERSION`.'
      tags: [ApprovalRules]
      x-permission: proc.approval_rule.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ================================================================ Price history
  /price-history:
    get:
      operationId: listPriceHistory
      summary: Qiymət tarixçəsi
      description: |
        Məhsul × təchizatçı üzrə PO qiymətləri, AZN-ə çevrilmiş dəyər və əvvəlki qiymətlə fərq (`PriceVarianceCalculator`
        job-u doldurur). `PriceChanged` event-i `diffPct` sıfırdan fərqli olanda göndərilir. `master.product.view_cost`
        tələb olunur — anbardar bu endpoint-i görmür.
      tags: [PriceHistory]
      x-permission: master.product.view_cost
      parameters:
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/SupplierIdFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: minDiffPct
          in: query
          required: false
          description: Yalnız |diffPct| ≥ verilən dəyər olan sətirlər.
          schema:
            $ref: '#/components/schemas/Percent'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Qiymət sətirləri.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearer:
      $ref: './common.v1.yaml#/components/securitySchemes/bearer'
    oidc:
      $ref: './common.v1.yaml#/components/securitySchemes/oidc'

  parameters:
    IdempotencyKey:
      $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
    PathId:
      $ref: './common.v1.yaml#/components/parameters/PathId'
    Page:
      $ref: './common.v1.yaml#/components/parameters/Page'
    Size:
      $ref: './common.v1.yaml#/components/parameters/Size'
    Sort:
      $ref: './common.v1.yaml#/components/parameters/Sort'
    Search:
      $ref: './common.v1.yaml#/components/parameters/Search'
    DateFrom:
      $ref: './common.v1.yaml#/components/parameters/DateFrom'
    DateTo:
      $ref: './common.v1.yaml#/components/parameters/DateTo'
    SupplierIdFilter:
      $ref: './common.v1.yaml#/components/parameters/SupplierIdFilter'
    ProductIdFilter:
      $ref: './common.v1.yaml#/components/parameters/ProductIdFilter'
    IsActiveFilter:
      $ref: './common.v1.yaml#/components/parameters/IsActiveFilter'

  headers:
    Location:
      $ref: './common.v1.yaml#/components/headers/Location'

  responses:
    BadRequest:
      $ref: './common.v1.yaml#/components/responses/BadRequest'
    Unauthorized:
      $ref: './common.v1.yaml#/components/responses/Unauthorized'
    Forbidden:
      $ref: './common.v1.yaml#/components/responses/Forbidden'
    NotFound:
      $ref: './common.v1.yaml#/components/responses/NotFound'
    Conflict:
      $ref: './common.v1.yaml#/components/responses/Conflict'
    UnprocessableEntity:
      $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'

  schemas:
    # --- aliases into common ---
    Id:
      $ref: './common.v1.yaml#/components/schemas/Id'
    Decimal:
      $ref: './common.v1.yaml#/components/schemas/Decimal'
    Percent:
      $ref: './common.v1.yaml#/components/schemas/Percent'
    CurrencyCode:
      $ref: './common.v1.yaml#/components/schemas/CurrencyCode'
    Money:
      $ref: './common.v1.yaml#/components/schemas/Money'
    DateOnly:
      $ref: './common.v1.yaml#/components/schemas/DateOnly'
    DateTimeUtc:
      $ref: './common.v1.yaml#/components/schemas/DateTimeUtc'
    RowVersion:
      $ref: './common.v1.yaml#/components/schemas/RowVersion'
    AuditFields:
      $ref: './common.v1.yaml#/components/schemas/AuditFields'
    PageMeta:
      $ref: './common.v1.yaml#/components/schemas/PageMeta'
    ProblemDetails:
      $ref: './common.v1.yaml#/components/schemas/ProblemDetails'
    VersionedAction:
      $ref: './common.v1.yaml#/components/schemas/VersionedAction'

    VersionedComment:
      type: object
      required: [rowVersion]
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        comment:
          type: [string, 'null']
          maxLength: 1000

    # --- enums ---
    ProductType:
      type: string
      enum: [FOOD, NON_FOOD]
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    RequisitionStatus:
      type: string
