openapi: 3.1.0
info:
  title: WMS Notifications API
  version: 1.0.0
  summary: In-app bildirişlər (inbox), oxunma, oxunmamış sayı və bildiriş qaydaları (SPEC §5 Notification modulu).
  description: |
    Notification modulu **yalnız event-lə işləyir** — RabbitMQ `wms.events` exchange-indən gələn integration
    event-lərini (`GoodsReceiptPosted`, `BatchNearExpiry`, `PurchaseOrderApproved`, `StockBelowMinimum` və s., SPEC §14.2)
    tenant-ın qaydalarına (`NotificationRule`) görə istifadəçi inbox-larına çevirir. Kanal: in-app (bu API), e-mail,
    push (mobil). Bildirişin özü heç bir domen məlumatını dəyişmir; `link` sahəsi client-i sənədə yönləndirir.

    **Route prefiksi `/api/v1/notifications` olduğundan** inbox resursu `/inbox` altındadır (`/notifications/notifications`
    təkrarından qaçmaq üçün) — CONVENTIONS-da göstərilən prefiks dəyişməyib.

    Cədvəl prefiksi: `notif_`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1/notifications
    description: Gateway (YARP) arxasında Notification modulu (`wms-worker` konteyneri ilə birgə)

security:
  - bearer: []
  - oidc: []

tags:
  - name: Inbox
    description: Cari istifadəçinin in-app bildirişləri.
  - name: Rules
    description: Tenant səviyyəli bildiriş qaydaları — hansı event kimə, hansı kanalla.
  - name: Devices
    description: Mobil push token-ləri.

paths:
  /inbox:
    get:
      operationId: listNotifications
      summary: Bildirişlərim
      description: Cari istifadəçinin bildirişləri, ən yenisi əvvəl. `unreadOnly=true` — yalnız oxunmamışlar.
      tags: [Inbox]
      x-permission: notif.inbox.view
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Severity'
        - name: eventType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
        - name: since
          in: query
          required: false
          description: Yalnız bu vaxtdan sonra yaranmışlar (mobil inkremental sinxron üçün).
          schema:
            $ref: '#/components/schemas/DateTimeUtc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Bildirişlər.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inbox/unread-count:
    get:
      operationId: getUnreadCount
      summary: Oxunmamış bildiriş sayı
      description: Badge üçün; `bySeverity` kritik alertləri ayrıca göstərməyə imkan verir. Client 60 saniyədən tez sorğulamamalıdır.
      tags: [Inbox]
      x-permission: notif.inbox.view
      responses:
        '200':
          description: Say.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inbox/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      operationId: getNotification
      summary: Bildiriş
      description: Bir bildiriş; oxunmuş kimi işarələmir.
      tags: [Inbox]
      x-permission: notif.inbox.view
      responses:
        '200':
          description: Bildiriş.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /inbox/{id}/read:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      operationId: markNotificationRead
      summary: Oxunmuş kimi işarələ
      description: İdempotentdir — artıq oxunmuşdursa `200` qaytarır. Yalnız öz bildirişi (`404` başqasınınki üçün).
      tags: [Inbox]
      x-permission: notif.inbox.view
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: İşarələndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /inbox/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Hamısını oxunmuş kimi işarələ
      description: '`before` verildikdə yalnız həmin vaxta qədər olanlar (yeni gələnlər qalır).'
      tags: [Inbox]
      x-permission: notif.inbox.view
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  oneOf:
                    - $ref: '#/components/schemas/DateTimeUtc'
                    - type: 'null'
      responses:
        '200':
          description: İşarələndi.
          content:
            application/json:
              schema:
                type: object
                required: [markedCount]
                properties:
                  markedCount:
                    type: integer
                    format: int32
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rules:
    get:
      operationId: listNotificationRules
      summary: Bildiriş qaydaları
      description: Tenant qaydaları — event tipi → rol/istifadəçi/lokasiya hədəfi → kanallar.
      tags: [Rules]
      x-permission: notif.rule.view
      parameters:
        - name: eventType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventType'
        - $ref: '#/components/parameters/IsActiveFilter'
      responses:
        '200':
          description: Qaydalar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createNotificationRule
      summary: Qayda yarat
      description: |
        Hədəf: rol kodu (`targetRoleCode`), konkret istifadəçilər (`targetUserIds`) və/yaxud "sənədin lokasiyasına
        girişi olanlar" (`targetLocationScoped=true`). Ən azı bir hədəf və bir kanal olmalıdır (`422`).

        `409` kodları: `IDEMPOTENT_REPLAY`.
      tags: [Rules]
      x-permission: notif.rule.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRuleCreate'
      responses:
        '201':
          description: Yaradıldı.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /rules/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    put:
      operationId: updateNotificationRule
      summary: Qaydanı yenilə
      description: '`409` kodları: `STALE_VERSION`.'
      tags: [Rules]
      x-permission: notif.rule.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRuleUpdate'
      responses:
        '200':
          description: Yeniləndi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteNotificationRule
      summary: Qaydanı sil
      description: Sistem qaydaları (`isSystem=true`, məs. kritik reconciliation alerti) silinmir — `409`.
      tags: [Rules]
      x-permission: notif.rule.manage
      responses:
        '204':
          description: Silindi.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /devices:
    post:
      operationId: registerDevice
      summary: Mobil push token-i qeyd et
      description: Eyni `deviceId` üçün token yenilənir. Logout-da `unregisterDevice` çağırılmalıdır.
      tags: [Devices]
      x-permission: notif.inbox.view
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '204':
          description: Qeyd edildi.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    delete:
      operationId: unregisterDevice
      summary: Push token-i sil
      description: Logout / cihaz dəyişmə.
      tags: [Devices]
      x-permission: notif.inbox.view
      responses:
        '204':
          description: Silindi.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearer:
      $ref: './common.v1.yaml#/components/securitySchemes/bearer'
    oidc:
      $ref: './common.v1.yaml#/components/securitySchemes/oidc'

  parameters:
    IdempotencyKey:
      $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
    PathId:
      $ref: './common.v1.yaml#/components/parameters/PathId'
    Page:
      $ref: './common.v1.yaml#/components/parameters/Page'
    Size:
      $ref: './common.v1.yaml#/components/parameters/Size'
    IsActiveFilter:
      $ref: './common.v1.yaml#/components/parameters/IsActiveFilter'

  responses:
    BadRequest:
      $ref: './common.v1.yaml#/components/responses/BadRequest'
    Unauthorized:
      $ref: './common.v1.yaml#/components/responses/Unauthorized'
    Forbidden:
      $ref: './common.v1.yaml#/components/responses/Forbidden'
    NotFound:
      $ref: './common.v1.yaml#/components/responses/NotFound'
    Conflict:
      $ref: './common.v1.yaml#/components/responses/Conflict'
    UnprocessableEntity:
      $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'

  schemas:
    Id:
      $ref: './common.v1.yaml#/components/schemas/Id'
    DateTimeUtc:
      $ref: './common.v1.yaml#/components/schemas/DateTimeUtc'
    RowVersion:
      $ref: './common.v1.yaml#/components/schemas/RowVersion'
    PageMeta:
      $ref: './common.v1.yaml#/components/schemas/PageMeta'
    ProblemDetails:
      $ref: './common.v1.yaml#/components/schemas/ProblemDetails'

    EventType:
      type: string
      description: Integration event-ləri (SPEC §14.2) + sistem alertləri (SPEC §15).
      enum:
        - GoodsReceiptPosted
        - ReceiptVarianceDetected
        - StockBelowMinimum
        - StockOverMaximum
        - BatchNearExpiry
        - BatchExpired
        - PurchaseOrderApproved
        - PurchaseOrderPendingApproval
        - PriceChanged
        - WastePosted
        - WastePendingApproval
        - TransferCompleted
        - TransferDiscrepancy
        - StockRequestSubmitted
        - CountVarianceApproved
        - CountPendingApproval
        - CertificateExpiring
        - BalanceReconciliationFailed
        - DoubleEntryCheckFailed
        - ExportReady

    Severity:
      type: string
      enum: [INFO, WARNING, CRITICAL]

    Channel:
      type: string
      enum: [IN_APP, EMAIL, PUSH]

    Notification:
      type: object
      required: [id, eventType, severity, title, createdAt, isRead]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        eventType:
          $ref: '#/components/schemas/EventType'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
          maxLength: 200
          description: Tenant dilində (lokalizasiya server tərəfində, `tenant.locale`).
        body:
          type: [string, 'null']
          maxLength: 2000
        link:
          type: [string, 'null']
          description: Tətbiq daxili deep link, məs. `/inventory/goods-receipts/311` (mobil `az.wms.mobile://` ilə eyni yol).
        entityType:
          type: [string, 'null']
        entityId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        locationId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTimeUtc'
        isRead:
          type: boolean
        readAt:
          oneOf:
            - $ref: '#/components/schemas/DateTimeUtc'
            - type: 'null'
        eventId:
          type: string
          format: uuid
          description: Mənbə event-in id-si (idempotent consumer dedup üçün).

    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'

    UnreadCount:
      type: object
      required: [total, bySeverity]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        bySeverity:
          type: object
          required: [INFO, WARNING, CRITICAL]
          properties:
            INFO:
              type: integer
              format: int32
            WARNING:
              type: integer
              format: int32
            CRITICAL:
              type: integer
              format: int32
        pendingApprovals:
          type: integer
          format: int32
          description: Gözləyən approval addımlarının sayı (Procurement `listPendingApprovals` ilə eyni mənbə) — mobil badge üçün.

    NotificationRule:
      type: object
      required: [id, eventType, severity, channels, isSystem, isActive, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        eventType:
          $ref: '#/components/schemas/EventType'
        severity:
          $ref: '#/components/schemas/Severity'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        targetRoleCode:
          type: [string, 'null']
          maxLength: 48
        targetUserIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        targetLocationScoped:
          type: boolean
          description: '`true` — yalnız event-in `locationId`-sinə girişi olan istifadəçilərə.'
        digest:
          type: string
          enum: [IMMEDIATE, DAILY]
          description: '`DAILY` — gündəlik toplu e-mail (expiry, min stock kimi).'
        isSystem:
          type: boolean
        isActive:
          type: boolean
        rowVersion:
          $ref: '#/components/schemas/RowVersion'

    NotificationRuleCreate:
      type: object
      required: [eventType, severity, channels]
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
        severity:
          $ref: '#/components/schemas/Severity'
        channels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Channel'
        targetRoleCode:
          type: [string, 'null']
          maxLength: 48
        targetUserIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          default: []
        targetLocationScoped:
          type: boolean
          default: true
        digest:
          type: string
          enum: [IMMEDIATE, DAILY]
          default: IMMEDIATE

    NotificationRuleUpdate:
      allOf:
        - $ref: '#/components/schemas/NotificationRuleCreate'
        - type: object
          required: [isActive, rowVersion]
          properties:
            isActive:
              type: boolean
            rowVersion:
              $ref: '#/components/schemas/RowVersion'

    DeviceRegistration:
      type: object
      required: [deviceId, platform, pushToken]
      properties:
        deviceId:
          type: string
          maxLength: 128
        platform:
          type: string
          enum: [ANDROID, IOS]
        pushToken:
          type: string
          maxLength: 512
          description: FCM / APNs token.
        appVersion:
          type: [string, 'null']
          maxLength: 32
