name: web

# React side of the repo (ADR-013: web/ is Vite + React + TypeScript).
on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'contracts/openapi/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'contracts/openapi/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Dev defaults; real values are injected at image build time
  # (see deploy/docker/web.Dockerfile).
  VITE_API_BASE_URL: 'http://localhost:5001'
  VITE_KEYCLOAK_ISSUER: 'http://localhost:8180/realms/wms'
  VITE_KEYCLOAK_CLIENT_ID: 'wms-web'

jobs:
  lint-test-build:
    name: lint + typecheck + test + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Node / npm versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      # The generated OpenAPI types are gitignored (ADR-007) - regenerate them so that
      # lint/typecheck/test see the same sources a developer has locally. The script
      # lives in web/package.json and reads ../contracts/openapi.
      - name: Generate API types from contracts
        run: npm run gen:api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: wms-web-build
          path: web/dist
          if-no-files-found: error
          retention-days: 7
