name: mobile

# Flutter side of the repo (ADR-013: mobile/ is Flutter, web/ is React).
on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'contracts/openapi/**'
      - 'scripts/gen-client.sh'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'contracts/openapi/**'
      - 'scripts/gen-client.sh'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  # Dev defaults; real values are injected at build time.
  API_BASE_URL: 'http://localhost:5001'
  KEYCLOAK_ISSUER: 'http://localhost:8180/realms/wms'

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      # Pub workspace: a single `pub get` at mobile/ resolves the app and every package.
      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get

      # The generated OpenAPI client is gitignored (ADR-007) - regenerate it so that
      # analyze/test see the same sources a developer has locally.
      - name: Generate API client from contracts
        run: ./scripts/gen-client.sh

      - name: build_runner (built_value / freezed / json_serializable)
        working-directory: mobile
        run: dart run melos run gen

      - name: Localizations
        working-directory: mobile
        run: dart run melos run l10n

      - name: Format check
        working-directory: mobile
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-pub

      # melos exec --dir-exists=test runs `flutter test` in every package/app that has tests.
      - name: Test (all packages)
        working-directory: mobile
        run: dart run melos run test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-output
          path: |
            mobile/**/coverage/lcov.info
            mobile/**/test/failures/**
          if-no-files-found: ignore
          retention-days: 14

  build-mobile:
    name: build apk (wms_mobile)
    runs-on: ubuntu-24.04
    needs: [analyze-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android Gradle Plugin requires JDK 17.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/apps/wms_mobile/android/**/*.gradle*', 'mobile/apps/wms_mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve workspace dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate API client from contracts
        run: ./scripts/gen-client.sh

      - name: build_runner
        working-directory: mobile
        run: dart run melos run gen

      - name: Localizations
        working-directory: mobile
        run: dart run melos run l10n

      # Debug APK: the release build needs a signing keystore, which is not in CI.
      - name: Build APK (debug)
        working-directory: mobile/apps/wms_mobile
        run: >
          flutter build apk
          --debug
          --no-pub
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=KEYCLOAK_ISSUER=${{ env.KEYCLOAK_ISSUER }}
          --dart-define=KEYCLOAK_CLIENT_ID=wms-mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wms-mobile-debug-apk
          path: mobile/apps/wms_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
