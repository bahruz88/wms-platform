name: wms_mobile
description: WMS mobile app (Android + iOS) for warehouse keepers and branch users.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace

dependencies:
  # Required by the Cupertino page transition used on iOS.
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  feature_consumption: ^0.1.0
  feature_identity: ^0.1.0
  feature_inventory: ^0.1.0
  feature_master_data: ^0.1.0
  feature_notifications: ^0.1.0
  feature_procurement: ^0.1.0
  feature_reporting: ^0.1.0
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  wms_api_client: ^0.1.0
  wms_auth: ^0.1.0
  wms_core: ^0.1.0
  wms_design_system: ^0.1.0
  wms_l10n: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
