name: wms_api_client
description: Dio-based typed HTTP client for the WMS API - interceptors (auth, idempotency, problem+json, logging) and per-module APIs/DTOs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  crypto: ^3.0.7
  decimal: ^3.2.6
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.16.0
  uuid: ^4.6.0
  wms_core: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  test: ^1.25.6
