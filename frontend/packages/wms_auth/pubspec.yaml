version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  meta: ^1.16.0
  wms_api_client: ^0.1.0
  wms_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
