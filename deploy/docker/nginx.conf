# nginx config for the WMS React (Vite) bundle - deploy/docker/web.Dockerfile.
# Installed as an envsubst template (/etc/nginx/templates/default.conf.template); the
# official nginx image substitutes ${...} at container start.
#
#   API_UPSTREAM   gateway:8080 (dev / k8s)  |  wms-api:8080 (on-prem)
#   DNS_RESOLVER   auto-detected by /docker-entrypoint.d/05-resolver.envsh
#   CSP_POLICY     optional Content-Security-Policy value; empty (default) = header not sent.
#                  See deploy/README.md - it has to name the Keycloak and MinIO origins,
#                  which are deployment-specific.
#
# The app is served same-origin: the bundle is built with an EMPTY VITE_API_BASE_URL, so it
# requests `/api/v1/<module>/...` from this very server and the `location /api/` block below
# forwards them to the gateway. This is deliberate - the gateway sends no CORS headers, so a
# cross-origin bundle cannot talk to it at all (and the Vite dev server proxies the same way,
# see web/vite.config.ts).

# ---- cache policy by path -----------------------------------------------------------------
# Vite emits every JS/CSS/asset under /assets/ with a content hash in the filename, so those are
# immutable for a year. The HTML entry points must always revalidate, otherwise a browser keeps
# an old index.html pointing at asset files that no longer exist after a deploy.
map $uri $wms_cache_control {
    default                              "no-cache, must-revalidate";
    ~^/assets/.+\.[0-9a-zA-Z_-]{8,}\.[a-z0-9]+$  "public, max-age=31536000, immutable";
    ~^/assets/                           "public, max-age=31536000, immutable";
    ~^/$                                 "no-cache, must-revalidate";
    ~^/index\.html$                      "no-cache, must-revalidate";
    ~^/silent-renew\.html$               "no-cache, must-revalidate";
    ~\.html$                             "no-cache, must-revalidate";
    ~\.(?:woff2?|ttf|otf|eot)$           "public, max-age=604800";
    ~\.(?:png|jpe?g|gif|svg|ico|webp|avif)$ "public, max-age=604800";
    ~\.(?:webmanifest|json)$             "no-cache, must-revalidate";
}

# Empty CSP_POLICY -> `add_header` with an empty value emits nothing.
map $host $wms_csp {
    default "${CSP_POLICY}";
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # lazy upstream resolution: nginx starts even if the API is not up yet and
    # follows container IP changes (Docker) / Service IP (k8s)
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $wms_api_upstream "${API_UPSTREAM}";

    server_tokens       off;
    absolute_redirect   off;
    port_in_redirect    off;
    client_max_body_size 30m;   # attachments: 25 MB (SPEC §11) + multipart overhead

    # ---- compression ----
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/manifest+json application/problem+json
        image/svg+xml font/woff font/woff2 font/ttf;

    # ---- security headers (repeated in every location that sets add_header: nginx replaces,
    #      it does not merge, the inherited add_header set) ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy $wms_csp always;
    add_header Cache-Control $wms_cache_control always;

    # ---- container / k8s probe ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API -> gateway (same-origin; the bundle uses relative /api/v1/... URLs) ----
    # No URI part on proxy_pass => the original /api/v1/... path is forwarded unchanged,
    # which is exactly what the YARP routes expect.
    location /api/ {
        proxy_pass          http://$wms_api_upstream;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    Connection        "";
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;   # streaming / SSE friendly
        proxy_request_buffering off;

        # API responses are per-user and must never be cached by a shared or browser cache.
        # The server-level `add_header Cache-Control $wms_cache_control` would otherwise stamp
        # `public, max-age=...` on authenticated JSON.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
    }

    # ---- hashed bundle: served straight, never falls back to index.html ----
    # A missing /assets/... file means a stale index.html; answering 404 makes that obvious
    # instead of serving HTML with a JS content-type.
    location /assets/ {
        try_files $uri =404;
    }

    # ---- static bundle with SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
