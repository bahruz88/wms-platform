# nginx config for the Flutter web bundle. Installed as an envsubst template
# (/etc/nginx/templates/default.conf.template) - the official image substitutes
# ${API_UPSTREAM} and ${DNS_RESOLVER} at container start.
#
#   API_UPSTREAM  gateway:8080  (dev/k8s)  |  wms-api:8080 (on-prem)
#   DNS_RESOLVER  auto-detected by /docker-entrypoint.d/05-resolver.envsh

# Cache policy by path. The app shell + service worker must always revalidate,
# otherwise users keep an old build after a deployment. Flutter's service worker
# precaches main.dart.js etc. with `cache: reload`, so modest max-age is safe.
map $uri $wms_cache_control {
    default                              "public, max-age=3600";
    ~^/$                                 "no-cache, must-revalidate";
    ~^/index\.html$                      "no-cache, must-revalidate";
    ~^/flutter_bootstrap\.js$            "no-cache, must-revalidate";
    ~^/flutter_service_worker\.js$       "no-cache, must-revalidate";
    ~^/flutter\.js$                      "no-cache, must-revalidate";
    ~^/version\.json$                    "no-cache, must-revalidate";
    ~^/manifest\.json$                   "no-cache, must-revalidate";
    ~\.(?:js)$                           "public, max-age=3600";
    ~\.(?:wasm|woff2?|ttf|otf|eot)$      "public, max-age=604800";
    ~\.(?:png|jpe?g|gif|svg|ico|webp)$   "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # lazy upstream resolution: nginx starts even if the API is not up yet and
    # follows container IP changes (Docker) / Service IP (k8s)
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $wms_api_upstream "${API_UPSTREAM}";

    server_tokens       off;
    absolute_redirect   off;
    port_in_redirect    off;
    client_max_body_size 30m;   # attachments: 25 MB (SPEC §11) + multipart overhead

    # ---- compression ----
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/wasm application/manifest+json application/octet-stream
        image/svg+xml font/woff font/woff2 font/ttf;

    # ---- security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $wms_cache_control always;

    # ---- container / k8s probe ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API -> gateway (lets the web app use a relative `/api` base URL in prod) ----
    # No URI part on proxy_pass => the original /api/v1/... path is forwarded unchanged,
    # which is exactly what the YARP routes expect.
    location /api/ {
        proxy_pass          http://$wms_api_upstream;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    Connection        "";
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;   # streaming / SSE friendly
        proxy_request_buffering off;
    }

    # ---- static bundle with SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
