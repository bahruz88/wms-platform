# DEV-ONLY placeholder secrets, referenced from overlays/dev/kustomization.yaml.
#
# This file used to sit in base/, which meant `kubectl apply -k overlays/prod` overwrote the
# real production `wms-secrets` and `wms-db-admin` with CHANGE_ME on every deploy - and apply
# prints "secret/wms-secrets configured", so nothing looked wrong until the pods restarted.
# It is dev-only now. In prod both Secrets are created and rotated OUTSIDE kustomize
# (External Secrets Operator, SealedSecrets, or a one-off `kubectl create secret`), and
# overlays/prod intentionally contains no Secret at all - see deploy/README.md §6.
apiVersion: v1
kind: Secret
metadata:
  name: wms-secrets
  labels:
    app.kubernetes.io/part-of: wms
type: Opaque
stringData:
  ConnectionStrings__Wms: "Server=mysql.wms-infra.svc.cluster.local;Port=3306;Database=wms;User=wms_app;Password=CHANGE_ME;"
  ConnectionStrings__WmsMigrator: "Server=mysql.wms-infra.svc.cluster.local;Port=3306;Database=wms;User=wms_migrator;Password=CHANGE_ME;"
  RabbitMq__User: wms
  RabbitMq__Password: CHANGE_ME
  Minio__AccessKey: CHANGE_ME
  Minio__SecretKey: CHANGE_ME
  # Shared secret for the module-to-module /internal/* routes (spec §4.2, backend/README.md §8.15).
  # Every API pod and the gateway-facing services must carry the SAME value; without it every
  # inter-module call answers 403 INTERNAL_ROUTE_FORBIDDEN and the hosts refuse to start with
  # ModuleTransport=Http. Generate with `openssl rand -hex 32`.
  InternalApi__Key: CHANGE_ME
---
# Root/admin DB credentials - used ONLY by the ledger-grants step of job-migrator.yaml
# (CALL wms_ops.apply_ledger_grants() needs GRANT rights). Never mount into API pods.
apiVersion: v1
kind: Secret
metadata:
  name: wms-db-admin
  labels:
    app.kubernetes.io/part-of: wms
type: Opaque
stringData:
  MYSQL_HOST: mysql.wms-infra.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_ADMIN_USER: root
  MYSQL_PWD: CHANGE_ME
