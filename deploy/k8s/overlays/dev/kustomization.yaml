# dev cluster: 1 replica each, `dev` image tag, dev hostnames, Development environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wms-dev
resources:
  - ../../base
  # Placeholder credentials, dev clusters only. prod has no Secret of its own on purpose.
  - secret-wms.dev.yaml
images:
  - name: ghcr.io/example/wms-api
    newTag: dev
  - name: ghcr.io/example/wms-gateway
    newTag: dev
  - name: ghcr.io/example/wms-migrator
    newTag: dev
  - name: ghcr.io/example/wms-web
    newTag: dev
replicas:
  - name: wms-gateway
    count: 1
  - name: wms-identity
    count: 1
  - name: wms-masterdata
    count: 1
  - name: wms-inventory
    count: 1
  - name: wms-procurement
    count: 1
  - name: wms-reporting
    count: 1
  - name: wms-worker
    count: 1
  - name: wms-web
    count: 1
patches:
  # `dev` is a MUTABLE tag: the deploy workflow re-points it at a new build on every release.
  # With imagePullPolicy: IfNotPresent (the base default, right for the immutable sha-/semver
  # tags prod uses) a node that already cached `:dev` would keep serving the OLD image forever
  # and a rollout would look successful. Dev therefore pulls every time.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Ingress
      name: wms
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: wms-dev.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wms-dev.example.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: wms-config
      data:
        ASPNETCORE_ENVIRONMENT: Development
        Keycloak__Authority: https://auth-dev.example.com/realms/wms
