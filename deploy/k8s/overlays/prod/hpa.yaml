# Horizontal autoscaling, prod only.
#
# REQUIRES metrics-server in the cluster (`kubectl top pods` must work). Without it every HPA
# reports `<unknown>/70%` and never scales - it does NOT scale to minReplicas and it does not
# fail loudly, so check `kubectl -n wms describe hpa` after the first deploy.
#
# minReplicas equals the SPEC §18.1 replica count, which is also what overlays/prod declares in
# `replicas:`. That equality matters: `kubectl apply -k` writes spec.replicas back on every
# deploy, and if it were lower than the current HPA-chosen count the apply would briefly scale
# the service DOWN before the HPA pulled it back up. Same number, no sawtooth.
#
# wms-worker deliberately has no HPA: it is the single Hangfire server (Recreate strategy) and
# a second replica would run every recurring job twice.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wms-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wms-gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  # Fast up, slow down: a five-minute scale-down window keeps a burst of receipts from
  # thrashing the pool. (Written out per HPA on purpose - a YAML anchor cannot cross the
  # `---` between documents, and kustomize rejects the file with "unknown anchor".)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Percent, value: 100, periodSeconds: 60 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
---
