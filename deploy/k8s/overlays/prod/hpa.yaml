# The ledger core (ADR-002). SPEC §17.3 sizes the whole system at 100 concurrent users and
# p95 < 2 s; inventory is where that load lands, so it gets the widest range.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wms-inventory
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: wms-inventory }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Percent, value: 100, periodSeconds: 60 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
