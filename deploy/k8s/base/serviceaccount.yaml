# One ServiceAccount for every WMS workload.
#
# Why it exists at all: without it every pod runs as `default`, which in most clusters has
# its API token mounted at /var/run/secrets/kubernetes.io/serviceaccount. None of these
# workloads talks to the Kubernetes API, so the token is pure attack surface - a container
# escape or an SSRF in the API turns into cluster credentials. automountServiceAccountToken
# is therefore false here AND on every pod spec (the kustomize patch in kustomization.yaml),
# because the pod-level field is the one that actually wins.
#
# It is also the single place to hang registry credentials: add
#   imagePullSecrets: [{ name: ghcr-pull }]
# (the prod overlay does) after creating the secret once per namespace:
#   kubectl -n wms create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT with read:packages>
# Public GHCR packages need none of this; private ones fail with ImagePullBackOff without it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wms
  labels:
    app.kubernetes.io/part-of: wms
automountServiceAccountToken: false
