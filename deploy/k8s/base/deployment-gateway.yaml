# SPEC §18.1: wms-gateway (YARP), 2 replicas. Routes /api/v1/<module> to the module services
# (wms-identity, wms-masterdata, wms-inventory, wms-procurement, wms-reporting on :8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-gateway
  labels:
    app.kubernetes.io/name: wms-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: wms
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: wms-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wms-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: wms
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wms-gateway
      containers:
        - name: gateway
          image: wms/gateway
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wms-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
