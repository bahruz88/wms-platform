# EXAMPLE secrets with placeholder values. In a real cluster replace them (kubectl create secret,
# SealedSecrets, External Secrets Operator ...) - see deploy/README.md "Sirlərin rotasiyası".
# Included in the base kustomization so `kustomize build` is self-contained; the prod overlay
# is expected to override both secrets.
apiVersion: v1
kind: Secret
metadata:
  name: wms-secrets
  labels:
    app.kubernetes.io/part-of: wms
type: Opaque
stringData:
  ConnectionStrings__Wms: "Server=mysql.wms-infra.svc.cluster.local;Port=3306;Database=wms;User=wms_app;Password=CHANGE_ME;"
  ConnectionStrings__WmsMigrator: "Server=mysql.wms-infra.svc.cluster.local;Port=3306;Database=wms;User=wms_migrator;Password=CHANGE_ME;"
  RabbitMq__User: wms
  RabbitMq__Password: CHANGE_ME
  Minio__AccessKey: CHANGE_ME
  Minio__SecretKey: CHANGE_ME
---
# Root/admin DB credentials - used ONLY by the ledger-grants step of job-migrator.yaml
# (CALL wms_ops.apply_ledger_grants() needs GRANT rights). Never mount into API pods.
apiVersion: v1
kind: Secret
metadata:
  name: wms-db-admin
  labels:
    app.kubernetes.io/part-of: wms
type: Opaque
stringData:
  MYSQL_HOST: mysql.wms-infra.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_ADMIN_USER: root
  MYSQL_PWD: CHANGE_ME
