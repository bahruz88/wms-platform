# SPEC §18.1: wms-worker - Hangfire jobs (§15) + notification/integration consumers. EXACTLY 1 replica, Recreate strategy (no two schedulers at once). Hangfire dashboard on :8080/hangfire (cluster-internal only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-worker
  labels:
    app.kubernetes.io/name: wms-worker
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: wms
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: wms-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wms-worker
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: wms
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654          # `app` user of mcr.microsoft.com/dotnet/aspnet
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wms-worker
      containers:
        - name: api
          image: wms/api
          imagePullPolicy: IfNotPresent
          env:
            - name: Modules
              value: "*"
            - name: Jobs__Enabled
              value: "true"
            - name: ModuleTransport
              value: InProcess
          envFrom:
            - configMapRef:
                name: wms-config
            - secretRef:
                name: wms-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app        # DataProtection keys, .NET caches
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
