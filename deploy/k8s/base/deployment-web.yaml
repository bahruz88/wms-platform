# Flutter web bundle served by nginx (deploy/docker/web.Dockerfile). The image is built with
# API_BASE_URL=/api, so nginx proxies /api -> wms-gateway (API_UPSTREAM); the Ingress routes
# /api to the gateway directly as well - both paths work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms-web
  labels:
    app.kubernetes.io/name: wms-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: wms
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: wms-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wms-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: wms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx user of nginxinc/nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: wms/web
          imagePullPolicy: IfNotPresent
          env:
            - name: API_UPSTREAM
              value: wms-gateway:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp                 # pid file + temp paths of nginx-unprivileged
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d    # envsubst writes default.conf here at start
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
