# Mounted at /etc/rabbitmq/conf.d/20-wms.conf (merged with the image defaults).
# The topology (exchange wms.events, queues wms.notification / wms.reporting /
# wms.integration, dead-letter) is NOT loaded here: a boot-time `load_definitions`
# suppresses creation of the RABBITMQ_DEFAULT_USER, which would force a hard-coded
# password hash into definitions.json. Instead the one-shot `rabbitmq-init` service
# imports deploy/rabbitmq/definitions.json through the management API.

# Memory / disk thresholds — sensible for a dev laptop or a small on-prem host.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Console logging (docker logs)
log.console = true
log.console.level = info

# Consumers must ack; default per-connection prefetch is set by the client.
# Quorum queues (RabbitMQ 4 default recommendation) are declared in definitions.json.
